name: Random access perf rig
# Full read vs random access (range transport, no auto-fetch), and this
# branch's random access vs master's ("base"), every variant in the same job
# (same machine), runs alternated; medians and PDF bytes read are printed.
# Books are made in the job (test/perf_rig/make_pdf.mjs), one shard per book:
# scan-like books and Talmud-like ones (many fonts spread through the file, a
# structure tree at the end).
on:
  push:
    branches:
      - sidecar-index
      - random-access-batch
    paths:
      - test/perf_rig/**
      - .github/workflows/perf_rig.yml
      - src/core/chunked_stream.js
      - src/core/worker.js
      - src/core/pdf_manager.js
      - web/pdf_find_controller.js
      - web/pdf_term_index.js
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rig:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - book: small
            pages: 40
            layout: scan
          - book: big
            pages: 830
            layout: scan
          - book: talmud-mid
            pages: 110
            layout: talmud
          - book: talmud-big
            pages: 300
            layout: talmud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build this branch and the base (master)
        run: |
          build() {
            (cd "$1" && npx gulp generic components)
            mkdir -p "$2/build" "$2/web"
            cp "$1"/build/generic/build/*.mjs "$2/build/"
            cp -r "$1"/build/components/* "$2/web/"
            cp -r "$1"/build/generic/web/cmaps "$1"/build/generic/web/standard_fonts "$1"/build/generic/web/wasm "$1"/build/generic/web/iccs "$2/"
          }
          build . rig-dist
          git worktree add ../base "$(git merge-base HEAD origin/master)"
          ln -s "$PWD/node_modules" ../base/node_modules
          build ../base rig-dist-base
      - name: Make the test book
        run: |
          mkdir -p rig-books
          node test/perf_rig/make_pdf.mjs rig-books/${{ matrix.book }}.pdf ${{ matrix.pages }} ${{ matrix.layout }}
      - name: A/B (alternating runs, medians)
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          PORT=5291 DIST=$PWD/rig-dist BOOKS=$PWD/rig-books node test/perf_rig/server.mjs &
          PORT=5293 DIST=$PWD/rig-dist-base BOOKS=$PWD/rig-books node test/perf_rig/server.mjs &
          sleep 2
          BOOKS=$PWD/rig-books node test/perf_rig/ab.mjs ${{ matrix.book }} 7 '[
            {"name":"full","port":5291,"opts":{"mode":"full"}},
            {"name":"ranges-base","port":5293,"opts":{"mode":"sparse"}},
            {"name":"ranges","port":5291,"opts":{"mode":"sparse"},"bytesCheck":true}
          ]' | tee rig.log; test ${PIPESTATUS[0]} -eq 0
          echo "PDF size: $(stat -c %s rig-books/${{ matrix.book }}.pdf) bytes"
          grep -E "^RESULT|^BYTES|FAIL" rig.log
          ! grep -q "BYTES TOO MANY" rig.log
      - name: First search - full read, base and this branch; index on vs off
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          PORT=5292 DIST=$PWD/rig-dist BOOKS=$PWD/rig-books node test/perf_rig/server.mjs &
          PORT=5294 DIST=$PWD/rig-dist-base BOOKS=$PWD/rig-books node test/perf_rig/server.mjs &
          sleep 2
          FULL=1 PORT=5292 node test/perf_rig/search.mjs ${{ matrix.book }} 3 amar zebra | tee search.log
          PORT=5294 node test/perf_rig/search.mjs ${{ matrix.book }} 3 amar zebra | sed 's/^SEARCH /SEARCH-BASE /' | tee -a search.log
          grep -E "^SEARCH|FAIL" search.log
