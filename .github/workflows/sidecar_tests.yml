name: Sidecar tests
on:
  push:
    branches:
      - sidecar-index
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint the changed files
        run: >
          npx eslint src/core/pdf_sidecar.js src/core/sidecar_find.js web/pdf_sidecar_codec.js
          src/core/worker.js src/display/api.js web/pdf_sidecar_store.js
          web/view_history.js web/app.js test/unit/pdf_sidecar_spec.js
          test/sidecar_bench.mjs web/pdf_fm_index.js web/pdf_text_index.js
          web/pdf_find_controller.js test/text_index_bench.mjs

      - name: Text index parity + bench (FM index vs PDFFindController)
        run: |
          set -o pipefail
          status=0
          for f in synthetic test/pdfs/tracemonkey.pdf test/pdfs/ArabicCIDTrueType.pdf test/pdfs/basicapi.pdf test/pdfs/Type3WordSpacing.pdf test/pdfs/type3_advance.pdf test/pdfs/vertical.pdf test/pdfs/perf_text_cmap_mixed.pdf; do
            node test/text_index_bench.mjs "$f" > ti.log 2>&1 || status=1
            grep -E "^FILE|MISMATCH|^PARITY| default " ti.log
          done
          exit $status

      - name: Build generic
        run: npx gulp generic

      - name: Unit tests (lib-legacy, all CLI specs incl. pdf_sidecar_spec)
        run: npx gulp unittestcli 2>&1 | tee unittest.log

      - name: Key results
        if: always()
        run: |
          echo "### Sidecar + find/text specs"
          grep -E "pdf_sidecar|specs?, [0-9]+ failures?|Failures:|^[0-9]+\) " unittest.log | head -60 || true

      - name: Sidecar bench (build time/size, direct search vs getTextContent)
        run: |
          for f in tracemonkey.pdf ArabicCIDTrueType.pdf basicapi.pdf Type3WordSpacing.pdf type3_advance.pdf vertical.pdf perf_text_cmap_mixed.pdf; do
            node test/sidecar_bench.mjs "test/pdfs/$f" the trace JavaScript zebra "trace tree" "$(printf 'ال')"
          done
